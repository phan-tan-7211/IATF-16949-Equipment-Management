<!doctype html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>CEV Equipment · Apps Script</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
    body { margin: 0; padding: 24px; line-height: 1.5; }
    main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
    button { min-height: 44px; padding: 10px 16px; font: inherit; cursor: pointer; }
    pre { padding: 16px; border: 1px solid currentColor; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <header>
      <p>IATF 16949 · Apps Script first-party diagnostic</p>
      <h1>Kiểm tra Google persistence</h1>
      <p>Trang này chạy trực tiếp trong Apps Script và gọi server bằng <code>google.script.run</code>. Không ghi dữ liệu.</p>
    </header>

    <button id="run" type="button">Kiểm tra kết nối</button>
    <pre id="output" aria-live="polite">Sẵn sàng.</pre>
  </main>

  <script>
    const CONTRACT_VERSION = <?!= JSON.stringify(contractVersion) ?>
    const output = document.getElementById('output')
    const run = document.getElementById('run')

    function show(value) {
      output.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2)
    }

    function invoke(payload) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((error) => reject(new Error(error && error.message ? error.message : String(error))))
          .bridgeInvoke(Object.assign({}, payload, { contractVersion: CONTRACT_VERSION }))
      })
    }

    run.addEventListener('click', async () => {
      run.disabled = true
      show('Đang kiểm tra Apps Script first-party transport…')

      try {
        const health = await invoke({ action: 'health' })
        if (!health.ok || !health.authenticated || health.contractVersion !== CONTRACT_VERSION) {
          throw new Error('APP_SHELL_HEALTH_INVALID')
        }

        const read = await invoke({ action: 'readTable', table: 'Equipment_Master' })
        show({
          phase: 'apps-script-first-party',
          ok: true,
          health,
          read: {
            ok: read.ok,
            table: read.table,
            actor: read.actor,
            rowCount: Array.isArray(read.rows) ? read.rows.length : null,
          },
        })
      } catch (error) {
        show({
          phase: 'apps-script-first-party',
          ok: false,
          error: error instanceof Error ? error.message : String(error),
        })
      } finally {
        run.disabled = false
      }
    })
  </script>
</body>
</html>
