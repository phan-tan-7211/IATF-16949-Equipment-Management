<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CEV Apps Script Bridge</title>
  </head>
  <body>
    <script>
      (function () {
        'use strict'

        const CHANNEL = 'CEV_APPS_SCRIPT_BRIDGE'
        const allowedOrigins = <?!= allowedOriginsJson ?>
        const contractVersion = <?!= JSON.stringify(contractVersion) ?>

        function isAllowedOrigin(origin) {
          return allowedOrigins.indexOf(origin) !== -1
        }

        function send(targetWindow, targetOrigin, payload) {
          targetWindow.postMessage(Object.assign({ channel: CHANNEL }, payload), targetOrigin)
        }

        window.addEventListener('message', function (event) {
          if (!isAllowedOrigin(event.origin)) return

          const message = event.data
          if (!message || message.channel !== CHANNEL || message.type !== 'request') return

          const requestId = String(message.requestId || '')
          if (!requestId) return

          const request = Object.assign({}, message.payload || {}, {
            contractVersion: contractVersion,
          })

          google.script.run
            .withSuccessHandler(function (result) {
              send(event.source, event.origin, {
                type: 'response',
                requestId: requestId,
                ok: true,
                result: result,
              })
            })
            .withFailureHandler(function (error) {
              send(event.source, event.origin, {
                type: 'response',
                requestId: requestId,
                ok: false,
                error: error && error.message ? error.message : String(error),
              })
            })
            .bridgeInvokeV2(request)
        })

        if (window.parent && window.parent !== window) {
          allowedOrigins.forEach(function (origin) {
            send(window.parent, origin, {
              type: 'ready',
              contractVersion: contractVersion,
            })
          })
        }
      })()
    </script>
  </body>
</html>
