<script>
var calibrationEntryMasters=[],calibrationEntryEquipments=[];
var openScreenCalibrationEntryBase_=openScreen;
openScreen=function(name){
  openScreenCalibrationEntryBase_(name);
  toggleCalibrationEntry_(name);
};

function calibrationEntryRoleAllowed_(){
  return ['QUALITY','MANAGER','ADMIN'].indexOf(role)>=0;
}

function toggleCalibrationEntry_(screenName){
  var panel=el('calibrationEntryPanel');
  if(!panel)return;
  var visible=screenName==='Calibration'&&calibrationEntryRoleAllowed_();
  panel.style.display=visible?'block':'none';
  if(visible)loadCalibrationEntryOptions_();
}

function loadCalibrationEntryOptions_(){
  read('Calibration_Master',function(master){
    read('Equipment_Master',function(eq){
      calibrationEntryMasters=master;
      calibrationEntryEquipments=eq;
      var linked={};
      master.forEach(function(r){
        var code=String(r.equipmentId||'').trim();
        if(code)linked[code]=true;
      });
      var eligible=eq.filter(function(r){
        return r.equipmentType==='MEASUREMENT'&&linked[String(r.equipmentId||'')]&&r.status!=='DISPOSED'&&(!r.active||yes(r.active));
      });
      el('calEntryEquipment').innerHTML='<option value="">Chọn thiết bị đo kiểm</option>'+eligible.map(function(r){
        return '<option value="'+esc(r.equipmentId)+'">'+esc(r.equipmentId)+' · '+esc(r.equipmentName)+'</option>';
      }).join('');
      if(!eligible.length)el('calEntryStatus').textContent='Chưa có thiết bị đo kiểm đủ điều kiện: phải có trong danh mục gốc và đã liên kết hồ sơ hiệu chuẩn.';
      else el('calEntryStatus').textContent='';
    });
  });
}

function submitCalibrationEntry(event){
  event.preventDefault();
  clearFail();
  var input={
    equipmentId:el('calEntryEquipment').value,
    calibrationDate:el('calEntryDate').value,
    nextDueDate:el('calEntryNextDate').value,
    result:el('calEntryResult').value,
    calibrationProvider:val('calEntryProvider'),
    certificateNumber:val('calEntryCertificate'),
    certificateUrl:val('calEntryCertificateUrl'),
    labelPhotoUrl:val('calEntryLabelUrl')
  };
  if(!input.equipmentId||!input.calibrationDate||!input.nextDueDate){el('calEntryStatus').textContent='Vui lòng nhập đủ trường bắt buộc.';return}
  el('calEntrySubmit').disabled=true;
  call('calibrationSubmit',{
    operationId:'ui-calibration-'+Date.now()+'-'+Math.random().toString(36).slice(2),
    input:input
  },function(r){
    el('calEntrySubmit').disabled=false;
    el('calEntryStatus').textContent='Đã lưu '+r.result.calibrationId+' cho '+r.result.equipmentId;
    el('calibrationEntryForm').reset();
    loadCalibration();
    loadAudit();
  });
}

setTimeout(function(){
  if(el('screenCalibration')&&el('screenCalibration').classList.contains('on'))toggleCalibrationEntry_('Calibration');
},500);
</script>
