<script>
var VERSION=<?!= JSON.stringify(contractVersion) ?>,role='',email='',equipment=[],workOrders=[],handovers=[],opEquipment=null,opDaily=null,opWo=null,opHandover=null;
function el(x){return document.getElementById(x)}function val(x){return el(x).value.trim()}function txt(v){return v===undefined||v===null||v===''?'—':String(v)}function low(v){return String(v||'').toLowerCase()}function esc(v){return txt(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function yes(v){var s=String(v||'').toUpperCase();return s==='TRUE'||s==='1'||s==='YES'||s==='Y'}
function fail(m){el('error').style.display='block';el('errorText').textContent=message(m)}function clearFail(){el('error').style.display='none';el('errorText').textContent=''}function message(m){var s=String(m||'');if(s.indexOf('ROLE_NOT_ALLOWED')>=0)return'Bạn không có quyền thực hiện thao tác này.';if(s.indexOf('EQUIPMENT_ID_ALREADY_EXISTS')>=0)return'Mã thiết bị đã tồn tại.';if(s.indexOf('EQUIPMENT_HAS_HISTORY')>=0)return'Thiết bị đã có lịch sử nên không được xóa. Hãy ngừng sử dụng hoặc thanh lý.';if(s.indexOf('EQUIPMENT_VERSION_CONFLICT')>=0)return'Dữ liệu đã thay đổi. Hãy làm mới trước khi sửa tiếp.';if(s.indexOf('EQUIPMENT_UPDATED_AT_REQUIRED')>=0)return'Thiết bị nguồn chưa có mốc cập nhật để sửa an toàn.';if(s.indexOf('CALIBRATION_MASTER_LINK_REQUIRED')>=0)return'Thiết bị chưa được liên kết với hồ sơ quản lý hiệu chuẩn.';return s}
function call(name,payload,ok){google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))})[name](Object.assign({},payload||{},{contractVersion:VERSION}))}function bridge(payload,ok){google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))}).bridgeInvoke(Object.assign({},payload,{contractVersion:VERSION}))}function read(table,ok){bridge({action:'readTable',table:table},function(r){if(!r||!r.ok||!Array.isArray(r.rows)){fail('Không đọc được '+table);return}ok(r.rows)})}
function openScreen(n){['Overview','Equipment','Daily','Maintenance','Tooling','Calibration','Audit'].forEach(function(x){el('screen'+x).classList.toggle('on',x===n);el('tab'+x).setAttribute('aria-selected',String(x===n))});clearFail();({Overview:loadOverview,Equipment:loadEquipment,Daily:loadDaily,Maintenance:loadMaintenance,Tooling:loadTooling,Calibration:loadCalibration,Audit:loadAudit}[n])()}
function badge(v){var s=String(v||'').toUpperCase();if(['RUNNING','COMPLETED','VERIFIED','RELEASED','NORMAL','V','PASS'].indexOf(s)>=0)return'ok';if(['DOWN','STOPPED','DISPOSED','NOT_OPERABLE','FAIL','CRITICAL'].indexOf(s)>=0)return'bad';if(['MAINTENANCE','WAITING_APPROVAL','IN_PROGRESS','OVERDUE','LIMITED_USE'].indexOf(s)>=0)return'warn';return'info'}function label(v){return({RUNNING:'Đang hoạt động',DOWN:'Dừng do sự cố',MAINTENANCE:'Đang bảo trì',STOPPED:'Ngừng sử dụng',DISPOSED:'Đã thanh lý',PRODUCTION:'Sản xuất',MEASUREMENT:'Đo kiểm',OPEN:'Mới tạo',WAITING_APPROVAL:'Chờ phê duyệt',APPROVED:'Đã phê duyệt',IN_PROGRESS:'Đang thực hiện',COMPLETED:'Đã hoàn tất',VERIFIED:'Đã xác nhận',RELEASED:'Đã cho vận hành',NORMAL:'Bình thường',MINOR_ISSUE_MONITOR:'Theo dõi vấn đề nhỏ',NOT_OPERABLE:'Không thể vận hành'})[v]||txt(v)}
function loadSession(){google.script.run.withSuccessHandler(function(r){email=r.email||'';role=r.role||'';el('who').textContent=email+(role?' · '+role:'');el('ver').textContent=VERSION;if(role==='ADMIN')el('equipmentAdmin').classList.add('on')}).withFailureHandler(function(e){fail(e&&e.message?e.message:String(e))}).sessionInfo()}
function loadOverview(){clearFail();read('Equipment_Master',function(eq){read('Maintenance_Plan',function(pm){read('Maintenance_Work_Order',function(wo){el('sRun').textContent=eq.filter(function(r){return r.status==='RUNNING'}).length;el('sDown').textContent=eq.filter(function(r){return r.status==='DOWN'||r.status==='STOPPED'}).length;el('sOver').textContent=pm.filter(function(r){return r.status==='OVERDUE'}).length;el('sCritical').textContent=wo.filter(function(r){return r.priority==='CRITICAL'&&r.status!=='RELEASED'}).length})})})}
function equipmentOptions(){return'<option value="">Chọn thiết bị</option>'+equipment.filter(function(r){return r.status!=='DISPOSED'&&(!r.active||yes(r.active))}).map(function(r){return'<option value="'+esc(r.equipmentId)+'">'+esc(r.equipmentId)+' · '+esc(r.equipmentName)+'</option>'}).join('')}function fillEquipmentSelects(){['dEquipment','wEquipment'].forEach(function(x){el(x).innerHTML=equipmentOptions()})}
function loadEquipment(){clearFail();read('Equipment_Master',function(rows){equipment=rows;fillEquipmentSelects();filterEquipment()})}function filterEquipment(){var q=low(val('eSearch')),t=el('eFilterType').value,s=el('eFilterStatus').value;var rows=equipment.filter(function(r){if(t&&r.equipmentType!==t)return false;if(s&&r.status!==s)return false;return!q||[r.equipmentId,r.equipmentName,r.model,r.serialNumber,r.currentArea,r.currentLine].map(low).join(' ').indexOf(q)>=0});el('equipmentSummary').textContent=rows.length+' / '+equipment.length+' thiết bị';el('equipmentRows').innerHTML=rows.length?rows.map(renderEquipment).join(''):'<tr><td colspan="6" class="empty">Không có thiết bị phù hợp.</td></tr>'}
function renderEquipment(r){var a='—';if(role==='ADMIN'){var idj=JSON.stringify(String(r.equipmentId)),vj=JSON.stringify(String(r.updatedAt||''));a='<div class="actions"><button class="act" onclick="editEquipment('+idj+')">Sửa</button>';if(r.status==='DISPOSED')a+='<button class="act" disabled>Đã thanh lý</button>';else if(yes(r.active))a+='<button class="act" onclick="lifeEquipment('+idj+','+vj+',\'DEACTIVATE\')">Ngừng sử dụng</button><button class="act" onclick="lifeEquipment('+idj+','+vj+',\'DISPOSE\')">Thanh lý</button>';else a+='<button class="act" onclick="lifeEquipment('+idj+','+vj+',\'RESTORE\')">Khôi phục</button><button class="act" onclick="lifeEquipment('+idj+','+vj+',\'DISPOSE\')">Thanh lý</button>';a+='<button class="act" onclick="deleteEquipment('+idj+','+vj+')">Xóa</button></div>'}return'<tr><td><strong>'+esc(r.equipmentId)+'</strong><div class="muted">'+esc(r.serialNumber)+'</div></td><td>'+esc(r.equipmentName)+'</td><td><span class="badge info">'+esc(label(r.equipmentType))+'</span></td><td>'+esc(r.currentArea||r.currentLine)+'</td><td><span class="badge '+badge(r.status)+'">'+esc(label(r.status))+'</span></td><td>'+a+'</td></tr>'}
function equipmentInput(){var x={equipmentName:val('eName'),equipmentType:el('eType').value,model:val('eModel'),serialNumber:val('eSerial'),currentArea:val('eArea'),currentLine:val('eLine'),managingDepartment:val('eManage'),usingDepartment:val('eUse'),technicalSpecification:val('eSpec'),criticality:el('eCritical').value};var c=val('eCycle');if(c)x.maintenanceCycleMonths=Number(c);return x}function saveEquipment(e){e.preventDefault();clearFail();var editing=val('equipmentEditing'),input=equipmentInput();if(!editing)input.equipmentId=val('eId');if((!input.equipmentId&&!editing)||!input.equipmentName){el('eStatus').textContent='Mã và tên thiết bị là bắt buộc.';return}if(!opEquipment)opEquipment='ui-equipment-'+Date.now()+'-'+Math.random().toString(36).slice(2);el('eSave').disabled=true;var name=editing?'equipmentUpdate':'equipmentCreate',payload=editing?{operationId:opEquipment,equipmentId:editing,expectedUpdatedAt:val('equipmentVersion'),input:input}:{operationId:opEquipment,input:input};call(name,payload,function(r){el('eSave').disabled=false;opEquipment=null;el('eStatus').textContent=editing?'Đã cập nhật '+editing:'Đã tạo '+r.result.equipmentId;resetEquipmentForm(false);loadEquipment();loadAudit()})}
function editEquipment(code){var r=equipment.find(function(x){return String(x.equipmentId)===String(code)});if(!r)return;el('equipmentEditing').value=r.equipmentId;el('equipmentVersion').value=r.updatedAt||'';el('eId').value=r.equipmentId;el('eId').disabled=true;el('eName').value=r.equipmentName||'';el('eType').value=r.equipmentType||'PRODUCTION';el('eModel').value=r.model||'';el('eSerial').value=r.serialNumber||'';el('eArea').value=r.currentArea||'';el('eLine').value=r.currentLine||'';el('eManage').value=r.managingDepartment||'';el('eUse').value=r.usingDepartment||'';el('eCycle').value=r.maintenanceCycleMonths||'';el('eCritical').value=r.criticality||'';el('eSpec').value=r.technicalSpecification||'';el('equipmentFormTitle').textContent='Sửa thiết bị '+r.equipmentId;el('eSave').textContent='Lưu thay đổi';el('eCancel').hidden=false;el('equipmentAdmin').scrollIntoView({block:'start'})}function resetEquipmentForm(clear){el('equipmentForm').reset();el('eId').disabled=false;el('equipmentEditing').value='';el('equipmentVersion').value='';el('equipmentFormTitle').textContent='Thêm thiết bị';el('eSave').textContent='Lưu thiết bị';el('eCancel').hidden=true;if(clear!==false)el('eStatus').textContent=''}
function lifeEquipment(code,version,action){var n={DEACTIVATE:'ngừng sử dụng',RESTORE:'khôi phục',DISPOSE:'thanh lý'}[action];if(!confirm('Xác nhận '+n+' '+code+'?'))return;call('equipmentSetLifecycle',{operationId:'ui-life-'+Date.now()+'-'+Math.random().toString(36).slice(2),equipmentId:code,expectedUpdatedAt:version,action:action},function(){loadEquipment();loadOverview();loadAudit()})}function deleteEquipment(code,version){if(!confirm('Chỉ thiết bị chưa có lịch sử mới được xóa. Xác nhận xóa '+code+'?'))return;call('equipmentDelete',{operationId:'ui-delete-'+Date.now()+'-'+Math.random().toString(36).slice(2),equipmentId:code,expectedUpdatedAt:version},function(){loadEquipment();loadOverview();loadAudit()})}
function syncDaily(){var stop=el('dMark').value==='STOP_REPAIR';el('dPriority').disabled=!stop;el('dNote').required=stop}function loadDaily(){if(!equipment.length)read('Equipment_Master',function(r){equipment=r;fillEquipmentSelects()});read('Daily_Inspection',function(rows){el('dailySummary').textContent=rows.length+' bản ghi';el('dailyRows').innerHTML=rows.length?rows.slice().reverse().map(function(r){return'<tr><td>'+esc(r.equipmentId)+'</td><td>'+esc(r.inspectionDate)+' · '+esc(r.shift)+'</td><td><span class="badge '+badge(r.overallMark)+'">'+esc(r.overallMark)+'</span></td><td>'+esc(r.note)+'</td><td>'+esc(r.inspectorId)+'</td></tr>'}).join(''):'<tr><td colspan="5" class="empty">Chưa có dữ liệu.</td></tr>'})}function saveDaily(e){e.preventDefault();var mark=el('dMark').value,input={equipmentId:el('dEquipment').value,shift:el('dShift').value,overallMark:mark,note:val('dNote'),priority:mark==='STOP_REPAIR'?el('dPriority').value:''};if(!input.equipmentId||mark==='STOP_REPAIR'&&!input.note){el('dStatus').textContent='Vui lòng nhập đủ trường bắt buộc.';return}if(!opDaily)opDaily='ui-daily-'+Date.now()+'-'+Math.random().toString(36).slice(2);call('dailyInspectionSubmit',{operationId:opDaily,input:input},function(r){el('dStatus').textContent='Đã lưu '+r.result.inspectionId;opDaily=null;el('dailyForm').reset();syncDaily();loadDaily();loadMaintenance();loadOverview()})}
function nextAction(s){return({OPEN:'REQUEST_APPROVAL',WAITING_APPROVAL:'APPROVE',APPROVED:'START',IN_PROGRESS:'COMPLETE',COMPLETED:'VERIFY',VERIFIED:'RELEASE'})[s]||null}function actionName(a){return({REQUEST_APPROVAL:'Gửi phê duyệt',APPROVE:'Phê duyệt',START:'Bắt đầu',COMPLETE:'Hoàn tất',VERIFY:'Xác nhận',RELEASE:'Cho vận hành'})[a]||a}function handoverOf(id){return handovers.filter(function(h){return h.handoverId==='HO-'+id}).slice(-1)[0]||null}function fillHandover(){el('hWorkOrder').innerHTML='<option value="">Chọn yêu cầu đã xác nhận</option>'+workOrders.filter(function(w){return w.status==='VERIFIED'&&!handoverOf(w.workOrderId)}).map(function(w){return'<option value="'+esc(w.workOrderId)+'">'+esc(w.workOrderId)+' · '+esc(w.equipmentId)+'</option>'}).join('')}
function loadMaintenance(){if(!equipment.length)read('Equipment_Master',function(r){equipment=r;fillEquipmentSelects()});read('Maintenance_Work_Order',function(w){workOrders=w;read('Equipment_Handover',function(h){handovers=h;fillHandover();el('maintenanceSummary').textContent=w.length+' yêu cầu';el('maintenanceRows').innerHTML=w.length?w.slice().reverse().map(renderWorkOrder).join(''):'<tr><td colspan="5" class="empty">Chưa có yêu cầu.</td></tr>'})})}function renderWorkOrder(r){var a=nextAction(r.status),h=handoverOf(r.workOrderId),accepted=h&&yes(h.accepted),buttons='—',idj=JSON.stringify(String(r.workOrderId));if(r.status==='VERIFIED'){if(!h)buttons='<button class="act" onclick="chooseHandover('+idj+')">Tạo bàn giao</button>';else if(!accepted)buttons='<button class="act" onclick="acceptHandover('+idj+')">Xác nhận nhận</button>';else if(h.condition==='NOT_OPERABLE')buttons='<span class="badge bad">Không thể vận hành</span>';else buttons='<button class="act" onclick="transitionWo('+idj+',\'RELEASE\')">Cho vận hành</button>'}else if(a)buttons='<button class="act" onclick="transitionWo('+idj+','+JSON.stringify(a)+')">'+esc(actionName(a))+'</button>';return'<tr><td><strong>'+esc(r.workOrderId)+'</strong></td><td>'+esc(r.equipmentId)+'</td><td>'+esc(r.reason)+'</td><td><span class="badge '+badge(r.status)+'">'+esc(label(r.status))+'</span></td><td>'+buttons+'</td></tr>'}
function saveWorkOrder(e){e.preventDefault();var input={equipmentId:el('wEquipment').value,sourceType:el('wSource').value,sourceId:val('wSourceId'),reason:val('wReason'),priority:el('wPriority').value,method:val('wMethod')};if(!input.equipmentId||!input.reason)return;if(!opWo)opWo='ui-wo-'+Date.now()+'-'+Math.random().toString(36).slice(2);bridge({action:'createMaintenanceWorkOrder',operationId:opWo,input:input},function(r){el('wStatus').textContent='Đã tạo '+r.result.workOrderId;opWo=null;el('woForm').reset();loadMaintenance();loadOverview()})}function transitionWo(code,action){bridge({action:'maintenanceTransition',operationId:'ui-'+action.toLowerCase()+'-'+Date.now()+'-'+Math.random().toString(36).slice(2),workOrderId:code,workflowAction:action},function(){loadMaintenance();loadOverview();loadAudit()})}function chooseHandover(code){el('hWorkOrder').value=code;el('handoverBox').scrollIntoView({block:'start'});el('hPerson').focus()}function saveHandover(e){e.preventDefault();var input={workOrderId:el('hWorkOrder').value,condition:el('hCondition').value,toPerson:val('hPerson'),toDepartment:val('hDept'),reason:val('hReason')};if(!input.workOrderId||!input.toPerson||!input.reason)return;if(!opHandover)opHandover='ui-handover-'+Date.now()+'-'+Math.random().toString(36).slice(2);call('handoverSubmit',{operationId:opHandover,input:input},function(r){el('hStatus').textContent='Đã tạo '+r.result.handoverId;opHandover=null;el('handoverForm').reset();loadMaintenance();loadAudit()})}function acceptHandover(code){call('handoverAccept',{operationId:'ui-accept-'+Date.now()+'-'+Math.random().toString(36).slice(2),workOrderId:code,receiverComment:''},function(){loadMaintenance();loadAudit()})}
function loadTooling(){read('Tooling_Master',function(rows){el('toolingSummary').textContent=rows.length+' dụng cụ';el('toolingRows').innerHTML=rows.length?rows.map(function(r){return'<tr><td>'+esc(r.toolingType)+'</td><td>'+esc(r.toolingName)+'</td><td>'+esc(r.toolingId||r.serialOrAssetNumber)+'</td><td>'+esc(r.usedFor)+'</td><td>'+esc(r.status)+'</td></tr>'}).join(''):'<tr><td colspan="5" class="empty">Danh mục đang trống; không dựng dữ liệu giả.</td></tr>'})}
function loadCalibration(){read('Calibration_Master',function(master){read('Calibration_Log',function(logs){var linked=master.filter(function(r){return String(r.equipmentId||'').trim()}).length;el('cTotal').textContent=master.length;el('cLinked').textContent=linked;el('cUnlinked').textContent=master.length-linked;el('cLogs').textContent=logs.length;el('cNotice').innerHTML=master.length-linked?'<strong>Còn '+(master.length-linked)+' hồ sơ nguồn chưa liên kết mã thiết bị gốc.</strong> Không tự ghép đoán; phải đối chiếu nguồn trước khi ghi hiệu chuẩn.':'Tất cả hồ sơ đã liên kết mã gốc.';el('calibrationRows').innerHTML=master.map(function(r){var code=String(r.equipmentId||'').trim();return'<tr><td><strong>'+esc(code||'Chưa liên kết')+'</strong></td><td>'+esc(r.controlNumber||r.calibrationEquipmentId)+'</td><td>'+esc(r.instrumentName||r.equipmentName)+'</td><td>'+esc(r.department||r.usingDepartment)+'</td><td>'+esc(r.nextDueDate||r.nextCalibrationDate)+'</td><td><span class="badge '+(code?'ok':'warn')+'">'+(code?'Đã liên kết':'Cần đối chiếu')+'</span></td></tr>'}).join('')})})}
function loadAudit(){read('Audit_Log',function(a){read('Equipment_Handover',function(h){el('aCount').textContent=a.length;el('aHandovers').textContent=h.length;el('aAccepted').textContent=h.filter(function(r){return yes(r.accepted)}).length;el('auditRows').innerHTML=a.length?a.slice(-30).reverse().map(function(r){return'<tr><td>'+esc(r.timestamp)+'</td><td>'+esc(r.userId)+'</td><td>'+esc(r.action)+'</td><td>'+esc(r.entityType)+' · '+esc(r.entityId)+'</td></tr>'}).join(''):'<tr><td colspan="4" class="empty">Chưa có dữ liệu.</td></tr>'})})}
loadSession();syncDaily();loadOverview();
</script>
