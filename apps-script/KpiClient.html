<script>
var openScreenKpiBase_=openScreen;
openScreen=function(name){openScreenKpiBase_(name);toggleKpiLive_(name)};

function toggleKpiLive_(name){var p=el('kpiLivePanel');if(!p)return;p.style.display=name==='Overview'?'block':'none';if(name==='Overview')loadKpiLive()}
function initializeKpiMonth_(){if(!el('kpiMonth')||el('kpiMonth').value)return;var d=new Date(),m=String(d.getMonth()+1).padStart(2,'0');el('kpiMonth').value=d.getFullYear()+'-'+m}
function pct_(v){return v===null||v===undefined?'Chưa đủ dữ liệu':(Number(v)*100).toFixed(1)+'%'}
function min_(v){return v===null||v===undefined?'Chưa đủ dữ liệu':Math.round(Number(v)).toLocaleString('vi-VN')}

function loadKpiLive(){
  initializeKpiMonth_();
  var period=el('kpiMonth').value.split('-');if(period.length!==2)return;
  call('dashboardKpi',{input:{year:Number(period[0]),month:Number(period[1])}},function(r){
    var d=r.data||{};
    el('kpiMaintenance').textContent=pct_(d.maintenanceOnTimeRate);
    el('kpiMaintenanceDetail').textContent=(d.onTimeMaintenancePlans||0)+' / '+(d.dueMaintenancePlans||0)+' kế hoạch đúng hạn';
    el('kpiDowntimeRate').textContent=pct_(d.downtimeRate);
    el('kpiMtbf').textContent=min_(d.mtbfMinutes);
    el('kpiMttr').textContent=min_(d.mttrMinutes);
    var notices=[];
    if(!d.completeness||!d.completeness.runtimeAvailable)notices.push('Chưa có ngày kiểm tra hằng ngày đủ để xác định tổng thời gian vận hành nền; tỷ lệ dừng máy và MTBF chưa được tính.');
    if(!d.completeness||!d.completeness.maintenanceRateAvailable)notices.push('Tháng này chưa có kế hoạch bảo trì có ngày kế hoạch để tính tỷ lệ đúng hạn.');
    if(!notices.length)notices.push('Dữ liệu KPI được tính trực tiếp từ kiểm tra hằng ngày, kế hoạch bảo trì, thực hiện bảo trì và sự kiện dừng máy.');
    el('kpiDataNotice').textContent=notices.join(' ');
    el('kpiDetailRows').innerHTML='<tr><td>'+esc(d.productionEquipmentCount)+'</td><td>'+esc(d.recordedEquipmentDays)+'</td><td>'+esc(d.runtimeMinutes===null?'Chưa đủ dữ liệu':d.runtimeMinutes)+'</td><td>'+esc(d.downtimeMinutes)+'</td><td>'+esc(d.failureCount)+'</td><td>'+esc(d.restoredFailureCount)+'</td></tr>';
  })
}
setTimeout(function(){initializeKpiMonth_();if(el('screenOverview')&&el('screenOverview').classList.contains('on'))toggleKpiLive_('Overview')},500);
</script>
