<script>
function calibrationEquipmentMap_(rows){
  var map={};
  (rows||[]).forEach(function(r){
    var id=String(r.equipmentId||'').trim();
    if(id)map[id]=r;
  });
  return map;
}

function calibrationLinkState_(masterRow,equipmentMap){
  var equipmentId=String(masterRow&&masterRow.equipmentId||'').trim();
  if(!equipmentId)return {state:'UNLINKED',equipmentId:'',equipment:null};
  var equipment=equipmentMap[equipmentId]||null;
  if(!equipment)return {state:'ORPHAN',equipmentId:equipmentId,equipment:null};
  if(String(equipment.equipmentType||'')!=='MEASUREMENT')return {state:'INVALID_TYPE',equipmentId:equipmentId,equipment:equipment};
  return {state:'LINKED',equipmentId:equipmentId,equipment:equipment};
}

function loadCalibration(){
  read('Calibration_Master',function(master){
    read('Equipment_Master',function(eq){
      read('Calibration_Log',function(logs){
        var equipmentMap=calibrationEquipmentMap_(eq);
        var states=master.map(function(r){return {row:r,link:calibrationLinkState_(r,equipmentMap)}});
        var linked=states.filter(function(x){return x.link.state==='LINKED'}).length;
        var orphan=states.filter(function(x){return x.link.state==='ORPHAN'||x.link.state==='INVALID_TYPE'}).length;
        var reconcile=master.length-linked;
        el('cTotal').textContent=master.length;
        el('cLinked').textContent=linked;
        el('cUnlinked').textContent=reconcile;
        el('cLogs').textContent=logs.length;
        if(orphan){
          el('cNotice').innerHTML='<strong>Phát hiện '+orphan+' liên kết lịch sử không có thiết bị đo kiểm gốc hợp lệ.</strong> Các hồ sơ này được đưa về trạng thái cần đối chiếu; không tự tạo hoặc tự ghép thiết bị.';
        }else if(reconcile){
          el('cNotice').innerHTML='<strong>Còn '+reconcile+' hồ sơ nguồn chưa liên kết mã thiết bị gốc.</strong> Không tự ghép đoán; phải đối chiếu nguồn trước khi ghi hiệu chuẩn.';
        }else{
          el('cNotice').textContent='Tất cả hồ sơ đã liên kết với thiết bị đo kiểm hợp lệ trong danh mục gốc.';
        }
        el('calibrationRows').innerHTML=states.map(function(x){
          var r=x.row,link=x.link;
          var displayCode=link.state==='LINKED'?link.equipmentId:(link.equipmentId||'Chưa liên kết');
          var labelText=link.state==='LINKED'?'Đã liên kết':(link.state==='UNLINKED'?'Cần đối chiếu':'Liên kết mồ côi');
          var badgeClass=link.state==='LINKED'?'ok':'warn';
          return '<tr><td><strong>'+esc(displayCode)+'</strong></td><td>'+esc(r.controlNumber||r.calibrationEquipmentId)+'</td><td>'+esc(r.instrumentName||r.equipmentName)+'</td><td>'+esc(r.department||r.usingDepartment)+'</td><td>'+esc(r.nextDueDate||r.nextCalibrationDate)+'</td><td><span class="badge '+badgeClass+'">'+esc(labelText)+'</span></td></tr>';
        }).join('');
      });
    });
  });
}

function loadCalibrationAdmin_(){
  read('Calibration_Master',function(master){
    read('Equipment_Master',function(eq){
      calibrationAdminSource=master;
      calibrationAdminEquipment=eq;
      var equipmentMap=calibrationEquipmentMap_(eq);
      var candidates=master.filter(function(r){return calibrationLinkState_(r,equipmentMap).state!=='LINKED'});
      var measurement=eq.filter(function(r){return r.equipmentType==='MEASUREMENT'&&r.status!=='DISPOSED'&&(!r.active||yes(r.active))});
      el('calibrationSourceRecord').innerHTML='<option value="">Chọn hồ sơ nguồn</option>'+candidates.map(function(r){
        var state=calibrationLinkState_(r,equipmentMap);
        var suffix=state.state==='UNLINKED'?'':' · đang tham chiếu '+state.equipmentId;
        return '<option value="'+esc(r.calibrationEquipmentId)+'">'+esc(r.controlNumber||r.calibrationEquipmentId)+' · '+esc(r.instrumentName||r.equipmentName)+esc(suffix)+'</option>';
      }).join('');
      el('calibrationRootEquipment').innerHTML='<option value="">Chọn thiết bị đo kiểm</option>'+measurement.map(function(r){
        return '<option value="'+esc(r.equipmentId)+'">'+esc(r.equipmentId)+' · '+esc(r.equipmentName)+'</option>';
      }).join('');
      var validLinked=master.filter(function(r){return calibrationLinkState_(r,equipmentMap).state==='LINKED'});
      el('calibrationLinkRows').innerHTML=validLinked.length?validLinked.map(function(r){
        var sourceId=JSON.stringify(String(r.calibrationEquipmentId||''));
        var equipmentId=JSON.stringify(String(r.equipmentId||''));
        return '<tr><td>'+esc(r.controlNumber||r.calibrationEquipmentId)+'</td><td><strong>'+esc(r.equipmentId)+'</strong></td><td>'+esc(r.instrumentName||r.equipmentName)+'</td><td><button class="act" onclick="unlinkCalibrationMaster_('+sourceId+','+equipmentId+')">Gỡ liên kết</button></td></tr>';
      }).join(''):'<tr><td colspan="4" class="empty">Chưa có hồ sơ nào liên kết với thiết bị đo kiểm gốc hợp lệ.</td></tr>';
      var orphanCount=master.length-validLinked.length-master.filter(function(r){return !String(r.equipmentId||'').trim()}).length;
      if(!measurement.length){
        el('calibrationLinkStatus').textContent='Chưa có thiết bị đo kiểm trong danh mục gốc. Hãy đăng ký thiết bị từ nguồn chính thức trước khi đối chiếu.';
      }else if(orphanCount){
        el('calibrationLinkStatus').textContent='Có '+orphanCount+' liên kết lịch sử mồ côi cần đối chiếu lại với thiết bị đo kiểm gốc.';
      }else{
        el('calibrationLinkStatus').textContent='';
      }
    });
  });
}

function linkCalibrationMaster(event){
  event.preventDefault();
  clearFail();
  var sourceId=el('calibrationSourceRecord').value;
  var equipmentId=el('calibrationRootEquipment').value;
  if(!sourceId||!equipmentId){el('calibrationLinkStatus').textContent='Vui lòng chọn đủ hai đối tượng.';return}
  var source=calibrationAdminSource.find(function(r){return String(r.calibrationEquipmentId||'')===String(sourceId)});
  var expectedCurrent=source?String(source.equipmentId||'').trim():'';
  el('calibrationLinkButton').disabled=true;
  call('calibrationLinkMaster',{
    operationId:'ui-cal-link-'+Date.now()+'-'+Math.random().toString(36).slice(2),
    calibrationEquipmentId:sourceId,
    equipmentId:equipmentId,
    expectedCurrentEquipmentId:expectedCurrent
  },function(r){
    el('calibrationLinkButton').disabled=false;
    el('calibrationLinkStatus').textContent='Đã đối chiếu '+r.result.calibrationEquipmentId+' → '+r.result.equipmentId;
    loadCalibrationAdmin_();
    loadCalibration();
    loadCalibrationEntryOptions_();
    loadAudit();
  });
}
</script>
