<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Apps Script browser smoke test</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }
    body { margin: 0; padding: 24px; line-height: 1.5; }
    main { max-width: 760px; margin: 0 auto; }
    button { min-height: 44px; padding: 10px 16px; font: inherit; cursor: pointer; }
    pre { padding: 16px; overflow-wrap: anywhere; white-space: pre-wrap; border: 1px solid currentColor; border-radius: 8px; }
    .stack { display: grid; gap: 16px; }
  </style>
</head>
<body>
  <main class="stack">
    <header>
      <p>IATF 16949 · Apps Script diagnostics</p>
      <h1>Browser smoke test</h1>
      <p>Trang này chỉ kiểm tra kết nối từ browser tới Apps Script. Không ghi dữ liệu.</p>
    </header>

    <button id="run" type="button">Kiểm tra kết nối</button>
    <pre id="output" aria-live="polite">Chưa chạy.</pre>
  </main>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzykTZpW60nZEdwXC3Wn2nRZe1ePrvhUwoER1cHjciiDNGZ34kWv_vfvhEpwSor-f95/exec'
    const output = document.getElementById('output')
    const run = document.getElementById('run')

    function show(value) {
      output.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2)
    }

    async function request(url) {
      const response = await fetch(url, {
        method: 'GET',
        credentials: 'include',
        redirect: 'follow',
      })
      if (!response.ok) throw new Error(`HTTP_${response.status}`)
      return response.json()
    }

    run.addEventListener('click', async () => {
      run.disabled = true
      show('Đang kiểm tra health từ origin: ' + location.origin)

      try {
        const healthUrl = new URL(WEB_APP_URL)
        healthUrl.searchParams.set('action', 'health')
        const health = await request(healthUrl)

        if (!health.ok || health.contractVersion !== 'G1-frozen-2026-08-28') {
          throw new Error('HEALTH_CONTRACT_INVALID')
        }
        if (!health.authenticated) {
          show({ phase: 'health', health, next: 'Mở Apps Script /exec trực tiếp bằng tài khoản Google đã được cấp quyền rồi thử lại.' })
          return
        }

        const readUrl = new URL(WEB_APP_URL)
        readUrl.searchParams.set('action', 'readTable')
        readUrl.searchParams.set('table', 'Equipment_Master')
        const read = await request(readUrl)

        show({
          phase: 'readTable',
          health,
          read: {
            ok: read.ok,
            table: read.table,
            actor: read.actor,
            rowCount: Array.isArray(read.rows) ? read.rows.length : null,
          },
        })
      } catch (error) {
        show({
          phase: 'browser-fetch',
          ok: false,
          error: error instanceof Error ? error.message : String(error),
          note: 'Nếu DevTools báo CORS hoặc redirect bị chặn, chưa được bật live write.',
        })
      } finally {
        run.disabled = false
      }
    })
  </script>
</body>
</html>
